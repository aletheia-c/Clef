<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="./logo.svg">
    <title>Clef</title>
  </head>
  <body>
    <svg hidden>
      <symbol id="icon-up" viewBox="0 0 16 16">
        <path d="M8 13.5v-11M3.5 7 8 2.5 12.5 7"/>
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 16 16">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3"/>
      </symbol>
      <symbol id="icon-new-folder" viewBox="0 0 16 16">
        <path d="M1.5 3.5h4.5l1.5 1.5h7v8.5h-13zM8 7.5v4M6 9.5h4"/>
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 16 16">
        <path d="M8 10.5v-8M4.5 6 8 2.5 11.5 6M2.5 10.5v3h11v-3"/>
      </symbol>
      <symbol id="icon-rename" viewBox="0 0 16 16">
        <path d="M10.5 2.5l3 3-8 8h-3v-3zM8.5 4.5l3 3"/>
      </symbol>
      <symbol id="icon-folder" viewBox="0 0 16 16">
        <path d="M1.5 3.5h4.5l1.5 1.5h7v8.5h-13z"/>
      </symbol>
      <symbol id="icon-file" viewBox="0 0 16 16">
        <path d="M3.5 1.5h6l3 3v10h-9zM9.5 1.5v3h3"/>
      </symbol>
    </svg>

    <header class="toolbar">
      <img class="logo" src="./logo.svg" alt="">
      <h1>Clef</h1>
      <button id="up" type="button" title="Up" aria-label="Up" disabled>
        <svg aria-hidden="true"><use href="#icon-up"/></svg>
      </button>
      <button id="refresh" type="button" title="Refresh" aria-label="Refresh">
        <svg aria-hidden="true"><use href="#icon-refresh"/></svg>
      </button>
      <button id="new-folder" type="button" title="New folder" aria-label="New folder">
        <svg aria-hidden="true"><use href="#icon-new-folder"/></svg>
      </button>
      <button id="upload" type="button" title="Upload" aria-label="Upload">
        <svg aria-hidden="true"><use href="#icon-upload"/></svg>
      </button>
      <input id="upload-input" type="file" multiple hidden>
      <button id="rename" type="button" title="Rename" aria-label="Rename" disabled>
        <svg aria-hidden="true"><use href="#icon-rename"/></svg>
      </button>
      <form id="path-form">
        <input id="path" type="text" aria-label="Path" spellcheck="false" autocomplete="off">
      </form>
      <span id="server-status" role="img"></span>
    </header>

    <p id="error" role="alert" hidden></p>

    <main id="listing">
      <table>
        <thead>
          <tr>
            <th class="name" data-sort="name"><button type="button">Name</button></th>
            <th data-sort="type"><button type="button">Type</button></th>
            <th><span>Extension</span></th>
            <th class="size" data-sort="size"><button type="button">Size</button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="sentinel"></div>
    </main>

    <aside id="tag-panel" hidden>
      <h2 id="tag-file"></h2>
      <figure id="tag-cover" hidden>
        <img id="tag-cover-image" alt="Album cover">
        <figcaption id="tag-cover-missing" hidden>No cover</figcaption>
      </figure>
      <p id="tag-status" hidden></p>
      <fieldset id="tag-editor" hidden>
        <dl id="tag-list"></dl>
        <form id="tag-add">
          <input id="tag-add-name" type="text" placeholder="Tag" aria-label="Tag" list="tag-names" required>
          <datalist id="tag-names"></datalist>
          <input id="tag-add-value" type="text" placeholder="Value" aria-label="Value" required>
          <button type="submit">Add</button>
        </form>
      </fieldset>
    </aside>

    <dialog id="confirm">
      <form method="dialog">
        <p id="confirm-message"></p>
        <div class="dialog-buttons">
          <button value="cancel" autofocus>Cancel</button>
          <button id="confirm-ok" value="ok"></button>
        </div>
      </form>
    </dialog>

    <dialog id="prompt">
      <form method="dialog">
        <label id="prompt-label" for="prompt-input"></label>
        <input id="prompt-input" type="text" spellcheck="false" autocomplete="off" required pattern="(?!\.\.?$)[^\/\\]+" title="A name without / or \">
        <div class="dialog-buttons">
          <button value="cancel" formnovalidate>Cancel</button>
          <button id="prompt-ok" value="ok"></button>
        </div>
      </form>
    </dialog>

    <footer class="status">
      <span id="activity" hidden></span>
      <span id="loading" hidden>Loading…</span>
      <span id="count"></span>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
